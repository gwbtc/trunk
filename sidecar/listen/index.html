<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Listen · Trunk</title>
<!--
  A listen-only page for Trunkline party lines.

  Galène's own client is a video-conferencing UI: it hides audio-only
  publishers behind a "display all" setting, and a tab that has never
  been clicked can't autoplay audio. Getting sound out of it took a
  settings panel and a play button — hopeless for someone handed a
  link.

  So this page does one thing. The button is the user gesture that
  unlocks autoplay AND the thing that connects, so there is no way to
  end up connected but silent. Everything Galène offers that a
  listener can't use — publishing, chat, hand-raising, file transfer,
  device pickers — simply isn't here.

  protocol.js is Galène's own client library, served by the same
  server, so the wire protocol can never drift from it.
-->
<link rel="stylesheet" href="listen.css">
</head>
<body>
<main>
  <h1>Trunk</h1>
  <p class="room" id="room">Party line</p>
  <p class="topic" id="topic" hidden></p>

  <button id="go">Listen</button>
  <p class="status" id="status" role="status">Audio starts when you press Listen.</p>

  <p class="trace" id="trace"></p>

  <div class="who" id="who" hidden>
    <strong>On the line</strong>
    <ul id="whoList"></ul>
  </div>

  <!-- One element per incoming stream, created here after the click.
       A single element cannot carry several speakers: an <audio> with
       a multi-track MediaStream plays only the first track in Chrome,
       so a second publisher could silently take over the output. -->
  <div id="sinks" hidden></div>
</main>

<script src="/protocol.js"></script>
<script src="listen.js"></script>
</body>
</html>
