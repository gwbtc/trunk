<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join a call · Trunk</title>
<link rel="icon" href="/apps/trunk/icon.svg">
<!--
  The guest page (wire 16 to 19): a call for someone with no ship,
  through an invite or a link the host or one of its apps made. It
  carries nothing of the host's but the room's title and the host's
  name.

  Its script and style are guest.js and guest.css beside it, never
  inline: a call server serves the same three files at /join/ (wire
  19), and Galène's CSP refuses inline scripts and styles. guest.js
  says how the two places work together, and how the page publishes
  so Talon can show it.
-->
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="guest.css">
</head>
<body>
<main>
  <h1>Trunk</h1>
  <p class="room" id="room">A call</p>
  <p class="host" id="host"></p>

  <form id="form" hidden>
    <label for="name">Your name, as others will see it</label>
    <input id="name" maxlength="40" autocomplete="name" required>
    <button id="join" type="submit">Join</button>
  </form>

  <p class="status" id="status" role="status">Loading…</p>
  <button id="sound" type="button" hidden>Turn on sound</button>
  <p class="alone" id="alone" hidden></p>
  <div class="grid" id="grid"></div>
  <div class="controls" id="controls" hidden>
    <button id="mute" type="button" class="quiet">Mute</button>
    <button id="camera" type="button" class="quiet">Start camera</button>
    <button id="share" type="button" class="quiet">Share screen</button>
    <button id="leave" type="button" class="quiet">Leave</button>
  </div>
</main>
<script src="guest.js"></script>
</body>
</html>
